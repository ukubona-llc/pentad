<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Universal Code of Everything</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <meta name="description" content="Ukubona builds digital twins for customized care.">
  <link rel="canonical" href="https://ukubona-llc.github.io/">
  <meta name="robots" content="index,follow">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0a0f">

  <!-- Open Graph / Twitter -->
  <meta property="og:site_name" content="Ukubona LLC">
  <meta property="og:title" content="Ukubona — Rehearsed Healthcare">
  <meta property="og:description" content="Healthcare reimagined as sequential, consequential play.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ukubona-llc.github.io/">
  <meta property="og:image" content="https://abikesa.github.io/logos/assets/ukubona-light.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ukubona — Rehearsed Healthcare">
  <meta name="twitter:description" content="Healthcare reimagined as sequential, consequential play. Try a scenario.">
  <meta name="twitter:image" content="https://abikesa.github.io/logos/assets/ukubona-light.png">

  <!-- Icons / assets -->
  <link rel="icon" href="https://abikesa.github.io/favicon/assets/favicon-light.ico" type="image/x-icon">
  <link rel="icon" href="https://abikesa.github.io/favicon/assets/favicon-light.ico" media="(prefers-color-scheme: light)">
  <link rel="icon" href="https://abikesa.github.io/favicon/assets/favicon-dark.ico" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="https://abikesa.github.io/logos/assets/ukubona-light.png" as="image">
  <link rel="preload" href="https://abikesa.github.io/logos/assets/ukubona-dark.png" as="image">
<style>
  :root {
    --bg:          #0a0a0f;
    --bg2:         #111118;
    --bg3:         #18181f;
    --border:      #2a2a38;
    --border2:     #1e1e2a;
    --text:        #e8e8f0;
    --text2:       #a0a0b8;
    --text3:       #5a5a72;
    --accent:      #7b6cff;
    --accent-bg:   #1a1730;
    --accent-text: #b8b0ff;
    --glow:        rgba(123,108,255,0.15);
    --radius:      12px;
    --radius-sm:   7px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 3rem 2rem 4rem;
    max-width: 820px;
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
  }

  /* Ambient glow behind everything */
  body::before {
    content: '';
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(123,108,255,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap { position: relative; z-index: 1; }

  /* ── Header ─────────────────────────────── */
  .header {
    text-align: center;
    margin-bottom: 3rem;
  }
  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: .75rem;
  }
  .main-title {
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 800;
    letter-spacing: -.02em;
    line-height: 1.1;
    background: linear-gradient(135deg, #e8e8f0 0%, #a0a0c8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ── Pipeline ────────────────────────────── */
  .pipeline {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0;
    position: relative;
    margin-bottom: 2.5rem;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    cursor: pointer;
  }

  /* Connector lines */
  .stage:not(:last-child)::after {
    content: '';
    position: absolute;
    top: 28px;
    left: calc(50% + 28px);
    width: calc(100% - 56px);
    height: 1px;
    background: linear-gradient(90deg, var(--border), var(--border2));
    z-index: 0;
  }

  .stage.active:not(:last-child)::after {
    background: linear-gradient(90deg, var(--accent), var(--border));
    opacity: .5;
  }

  .node {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--bg2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: 9.5px;
    font-weight: 700;
    line-height: 1.35;
    text-align: center;
    color: var(--text3);
    position: relative;
    z-index: 1;
    transition: all .2s ease;
    padding: 4px;
  }

  .stage:hover .node {
    border-color: var(--border);
    color: var(--text2);
    background: var(--bg3);
    box-shadow: 0 0 0 4px rgba(123,108,255,0.07);
  }

  .stage.active .node {
    border-color: var(--accent);
    background: var(--accent-bg);
    color: var(--accent-text);
    box-shadow: 0 0 0 5px var(--glow), 0 0 20px var(--glow);
  }

  .stage-tag {
    margin-top: 9px;
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--text3);
    text-align: center;
    letter-spacing: .05em;
    transition: color .2s;
  }

  .stage.active .stage-tag { color: var(--accent-text); }

  /* Step number */
  .stage-num {
    font-family: 'Space Mono', monospace;
    font-size: 8px;
    color: var(--text3);
    margin-bottom: 5px;
    opacity: .5;
  }
  .stage.active .stage-num { opacity: 1; color: var(--accent); }

  /* ── Divider ─────────────────────────────── */
  .divider {
    height: 1px;
    background: var(--border2);
    margin: 0 0 2rem;
  }

  /* ── Detail Card ─────────────────────────── */
  .detail {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 1.75rem 1.75rem 1.5rem;
    min-height: 240px;
    position: relative;
    overflow: hidden;
  }

  /* Subtle corner accent */
  .detail::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 120px; height: 120px;
    background: radial-gradient(circle at top left, var(--glow), transparent 70%);
    pointer-events: none;
  }

  .detail-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1rem;
  }

  .detail-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -.02em;
    color: var(--text);
  }

  .detail-tag {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 20px;
    background: var(--accent-bg);
    color: var(--accent-text);
    border: 1px solid rgba(123,108,255,0.2);
    letter-spacing: .08em;
  }

  .detail-body {
    font-size: 13.5px;
    color: var(--text2);
    line-height: 1.75;
    margin-bottom: 1.25rem;
  }

  .rows {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .75rem;
    margin-bottom: 1.25rem;
  }

  .row-card {
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: .7rem .9rem;
  }

  .row-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: .12em;
    margin-bottom: 4px;
  }

  .row-value {
    font-size: 13px;
    color: var(--text);
    line-height: 1.4;
    font-weight: 500;
  }

  .bayesian-note {
    padding: .85rem 1rem;
    border-left: 2px solid var(--accent);
    background: var(--accent-bg);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    font-size: 12.5px;
    color: var(--text2);
    line-height: 1.7;
  }

  .bayesian-note strong {
    color: var(--accent-text);
    font-weight: 700;
  }

  /* ── Loop Note ───────────────────────────── */
  .loop-note {
    text-align: center;
    font-size: 12px;
    color: var(--text3);
    margin-top: 2.5rem;
    line-height: 2;
    font-family: 'Space Mono', monospace;
  }

  .loop-note .chain {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text2);
    font-size: 11px;
    margin: .25rem 0;
  }

  .loop-note .chain span {
    color: var(--accent-text);
    font-weight: 700;
  }

  .loop-note .chain .arrow {
    color: var(--accent);
    opacity: .6;
  }

  .loop-note .closing {
    color: var(--text2);
    font-style: italic;
  }

  .loop-note .closing em {
    color: var(--accent-text);
    font-style: normal;
  }

  /* ── Animate in ──────────────────────────── */
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(10px); }
    to   { opacity:1; transform:translateY(0);    }
  }

  .detail { animation: fadeUp .25s ease; }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="eyebrow">Epistemology · Physics · Inference</div>
    <h1 class="main-title">The Universal Code of Everything</h1>
  </div>

  <div class="pipeline" id="pipeline"></div>

  <div class="divider"></div>

  <div class="detail" id="detail"></div>

  <div class="loop-note">
    The chain is not linear — it is a loop.<br>
    <div class="chain">
      <span>Reality</span><span class="arrow">→</span>
      <span>Data</span><span class="arrow">→</span>
      <span>Model</span><span class="arrow">→</span>
      <span>Decision</span><span class="arrow">→</span>
      <span>Reality</span>
    </div><br>
    <span class="closing">Only Bayesian inference makes the loop <em>explicit</em>:<br>priors are weights, posteriors are updated weights.</span>
  </div>

</div>

<script>
const stages = [
  {
    short: "Prior /\nHypothesis",
    label: "Prior / Hypothesis",
    tag: "A priori",
    sci: "Hypothesis",
    math: "Tensor",
    files: ".md → .py",
    bayesian: "The prior P(θ) — explicit parameters and weights. This is the only framework that writes down its assumptions before touching the data.",
    detail: "The full possibility space. Before a single measurement is taken, you encode what you believe. In Bayesian terms: P(θ). In physics: the state space. In ML: the architecture + weight initialisation.",
    physics: "State space — all possible configurations of the system before observation"
  },
  {
    short: "Study /\nPipeline",
    label: "Study / Pipeline",
    tag: "Compressor",
    sci: "Study design",
    math: "Matrix",
    files: ".ipynb → .html",
    bayesian: "The likelihood function P(data | θ) — how the data was generated given the parameters. Study design is the compression matrix that decides what information survives.",
    detail: "The measurement apparatus. Every design choice is a lossy compression: which variables to observe, how often, from whom. This is where most replication failures are born — the matrix was doing too much work.",
    physics: "Measurement operator — projects the state space onto observable quantities"
  },
  {
    short: "Data /\nVector",
    label: "Data / Vector",
    tag: "Observable",
    sci: "Observed data",
    math: "Vector",
    files: ".js → API",
    bayesian: "The sufficient statistic — data collapsed into the parameter estimates β₁, β₂, β₃... the list of bets you placed before the matrix compressed everything.",
    detail: "A list of parameter estimates. Not 'the truth' — a projection of truth through your measurement matrix. The vector lives in the space your study design carved out of the tensor.",
    physics: "Measurement outcome — a single realisation from the distribution"
  },
  {
    short: "Results /\nEigenmode",
    label: "Results / Eigenmode",
    tag: "Invariant",
    sci: "Likelihood / Results",
    math: "Eigenmode",
    files: ".py backend",
    bayesian: "The posterior P(θ | data) — what survives after the likelihood updates the prior. The eigenmode is what holds across persons, places, times. A fragile finding is a vector pretending to be an eigenmode.",
    detail: "The structure the universe hands back after it's done with your assumptions. Swap the patients, the country, the decade — if the parameter holds, you've found something real. This is the test of replication.",
    physics: "Normal mode — the pattern that persists under symmetry transformations of the system"
  },
  {
    short: "Inference /\nThreshold",
    label: "Inference / Threshold",
    tag: "Decision",
    sci: "Conclusion",
    math: "Scalar",
    files: ".wasm / deploy",
    bayesian: "The posterior predictive — one number you act on. p < 0.05 is a crude threshold. Bayes gives you the full distribution; you choose where to cut. Physics becomes decision.",
    detail: "The moment you commit. All the tensor's richness, all the matrix's compression, all the vector's estimates, all the eigenmode's invariance — collapsed to: yes or no, act or wait, publish or replicate.",
    physics: "Observable expectation value — the single number the experiment reports"
  }
];

let active = 0;

function render() {
  const p = document.getElementById('pipeline');
  p.innerHTML = stages.map((s, i) => `
    <div class="stage${i === active ? ' active' : ''}" onclick="select(${i})">
      <div class="stage-num">${String(i + 1).padStart(2, '0')}</div>
      <div class="node">${s.short.replace('\n', '<br>')}</div>
      <div class="stage-tag">${s.tag}</div>
    </div>
  `).join('');

  const s = stages[active];
  const d = document.getElementById('detail');
  d.innerHTML = `
    <div class="detail-header">
      <div class="detail-title">${s.label}</div>
      <div class="detail-tag">${s.tag}</div>
    </div>
    <div class="detail-body">${s.detail}</div>
    <div class="rows">
      <div class="row-card">
        <div class="row-label">Scientific</div>
        <div class="row-value">${s.sci}</div>
      </div>
      <div class="row-card">
        <div class="row-label">Mathematical</div>
        <div class="row-value">${s.math}</div>
      </div>
      <div class="row-card">
        <div class="row-label">Files / Stack</div>
        <div class="row-value">${s.files}</div>
      </div>
      <div class="row-card">
        <div class="row-label">Physics</div>
        <div class="row-value">${s.physics}</div>
      </div>
    </div>
    <div class="bayesian-note"><strong>Bayesian:</strong> ${s.bayesian}</div>
  `;

  // Trigger re-animation
  d.style.animation = 'none';
  d.offsetHeight; // reflow
  d.style.animation = '';
}

function select(i) { active = i; render(); }

render();
</script>
</body>
</html>
